<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}ENGCO ONE{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <div class="brand">ENGCO ONE</div>
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
    <a href="{{ url_for('agents') }}" class="{{ 'active' if active == 'agents' }}">Agents</a>
    <a href="{{ url_for('sops') }}" class="{{ 'active' if active == 'sops' }}">SOPs</a>
    <a href="{{ url_for('projects') }}" class="{{ 'active' if active == 'projects' }}">Projects</a>
    <a href="{{ url_for('scorecard') }}" class="{{ 'active' if active == 'scorecard' }}">Scorecard</a>
    <a href="{{ url_for('leads') }}" class="{{ 'active' if active == 'leads' }}">Leads Finder</a>
  </nav>
  <main>
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
